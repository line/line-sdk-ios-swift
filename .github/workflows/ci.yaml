name: "LINE SDK CI"

on: [push, pull_request]

jobs:
  test_sdk:
    name: Test LINE SDK
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        swift-version: ["6.0", "5.0", "4.2"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-gems-v2-${{ hashFiles('**/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-gems-
      - name: Bundle Install
        run: |
          bundle config path vendor/bundle
          bundle install --jobs 4 --retry 3
      - name: Test SDK
        env:
          SWIFT_VERSION: ${{ matrix.swift-version }}
        run: bundle exec fastlane sdk_tests
  lint_pod:
    name: Lint CocoaPods
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        swift-version: ["6.0", "5.0", "4.2"]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/cache@v4
      with:
        path: vendor/bundle
        key: ${{ runner.os }}-gems-v2-${{ hashFiles('**/Gemfile.lock') }}
        restore-keys: |
          ${{ runner.os }}-gems-
    - name: Bundle Install
      run: |
        bundle config path vendor/bundle
        bundle install --jobs 4 --retry 3
    - name: Debug CocoaPods environment
      run: |
        echo "=== System pod ==="
        which pod && pod --version || echo "no system pod"
        echo "=== Bundled pod ==="
        bundle exec which pod && bundle exec pod --version
        echo "=== Bundler version ==="
        bundle --version
        echo "=== Ruby version ==="
        ruby --version
        echo "=== pod lib available? ==="
        bundle exec pod lib --help 2>&1 | head -5 || true
    - name: Lint CocoaPods (direct)
      env:
        SWIFT_VERSION: ${{ matrix.swift-version }}
      run: |
        bundle exec pod lib lint LineSDKSwift.podspec --swift-version=${SWIFT_VERSION} --allow-warnings
        echo "exit code: $?"
  lint_spm:
    name: Lint Swift Package Manager
    runs-on: macos-15
    steps:
        - uses: actions/checkout@v4
        - uses: actions/cache@v4
          with:
            path: vendor/bundle
            key: ${{ runner.os }}-gems-v2-${{ hashFiles('**/Gemfile.lock') }}
            restore-keys: |
              ${{ runner.os }}-gems-
        - name: Bundle Install
          run: |
            bundle config path vendor/bundle
            bundle install --jobs 4 --retry 3
        - name: Lint Swift Package Manager
          run: bundle exec fastlane lint_spm
  xcframework:
    name: Build XCFramework
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-gems-v2-${{ hashFiles('**/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-gems-
      - name: Bundle Install
        run: |
          bundle config path vendor/bundle
          bundle install --jobs 4 --retry 3
      - name: Build XCFramework
        run: bundle exec fastlane xcframework version:ci
